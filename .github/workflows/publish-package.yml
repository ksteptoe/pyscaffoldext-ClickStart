# Publishes the package to PyPI when a version tag is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens or secrets required.
# See: https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  publish-package:
    runs-on: ubuntu-latest
    environment: pypi  # must match the Environment name in the PyPI pending publisher
    permissions:
      id-token: write  # required for OIDC trusted publishing
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # avoids shallow checkout as needed by setuptools-scm
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Build distributions
      run: |
        python -m pip install --upgrade pip setuptools tox
        python -m tox -e clean,build -- --sdist --wheel
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
